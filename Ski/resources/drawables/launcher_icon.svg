<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Sky and a slope running downhill to the right -->
  <circle cx="32" cy="32" r="31" fill="#3FA9F5"/>
  <path d="M1.59 38 L53.84 54 A31 31 0 0 1 1.59 38 Z" fill="#FFFFFF"/>
  <!-- Tail -->
  <path d="M19 44 C11 47 7 40 11.5 37" fill="none" stroke="#7B4A1E" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Legs kicked up towards the skis -->
  <path d="M28.5 43 L41 39.5 M30 38.5 L41.5 30.5" stroke="#7B4A1E" stroke-width="3.6" stroke-linecap="round"/>
  <!-- Skis, crossed and flying up; the white edge keeps them apart from the legs on black-and-white screens -->
  <rect x="31.5" y="31.4" width="28" height="4.2" rx="2.1" fill="#C62828" stroke="#FFFFFF" stroke-width="1.2" transform="rotate(-70 45.5 33.5)"/>
  <rect x="31.5" y="31.4" width="28" height="4.2" rx="2.1" fill="#E53935" stroke="#FFFFFF" stroke-width="1.2" transform="rotate(-20 45.5 33.5)"/>
  <!-- Body, sat down in the snow -->
  <ellipse cx="25" cy="38" rx="7.5" ry="8" fill="#7B4A1E" transform="rotate(-20 25 38)"/>
  <ellipse cx="25.5" cy="39.5" rx="4.6" ry="5.2" fill="#F2D2A9" transform="rotate(-20 25.5 39.5)"/>
  <!-- Arms flailing -->
  <path d="M19 33 L9.5 28 M30 32 L37.5 19.5" stroke="#7B4A1E" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="9.5" cy="28" r="2.5" fill="#F2D2A9"/>
  <circle cx="37.5" cy="19.5" r="2.5" fill="#F2D2A9"/>
  <!-- Ears and head -->
  <circle cx="13" cy="23.5" r="4.2" fill="#7B4A1E"/>
  <circle cx="13" cy="23.5" r="2.3" fill="#F2D2A9"/>
  <circle cx="33" cy="23.5" r="4.2" fill="#7B4A1E"/>
  <circle cx="33" cy="23.5" r="2.3" fill="#F2D2A9"/>
  <circle cx="23" cy="23" r="10" fill="#7B4A1E"/>
  <!-- Face: wide eyes and an "O" mouth -->
  <circle cx="19.8" cy="21.8" r="4.3" fill="#F2D2A9"/>
  <circle cx="26.2" cy="21.8" r="4.3" fill="#F2D2A9"/>
  <ellipse cx="23" cy="27.4" rx="6" ry="4.2" fill="#F2D2A9"/>
  <circle cx="19.8" cy="21.6" r="2.4" fill="#FFFFFF"/>
  <circle cx="26.2" cy="21.6" r="2.4" fill="#FFFFFF"/>
  <circle cx="20.1" cy="22" r="1.35" fill="#1A1A1A"/>
  <circle cx="26.5" cy="22" r="1.35" fill="#1A1A1A"/>
  <ellipse cx="23" cy="28.3" rx="1.7" ry="2.1" fill="#3A1A0A"/>
  <!-- Snow sprayed up where it landed -->
  <circle cx="14.5" cy="42" r="3" fill="#FFFFFF"/>
  <circle cx="9.5" cy="40" r="2" fill="#FFFFFF"/>
  <circle cx="34" cy="48.5" r="2.8" fill="#FFFFFF"/>
  <circle cx="38.5" cy="46.5" r="1.8" fill="#FFFFFF"/>
</svg>
